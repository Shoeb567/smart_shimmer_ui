name: smart_shimmer_ui
description: A modern, high-performance shimmer skeleton loading UI library for Flutter with ready-made presets, dark mode support, and customizable animations.
version: 1.0.0
homepage: https://github.com/Shoeb567/smart_shimmer_ui
repository: https://github.com/Shoeb567/smart_shimmer_ui
issue_tracker: https://github.com/Shoeb567/smart_shimmer_ui/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

topics:
  - shimmer
  - skeleton-loading
  - loading-animation
  - ui-components
  - placeholders

screenshots:
  - description: 'Classic Skeleton Loading List with avatar and shimmer wave.'
    path: screenshots/list_shimmer.png
  - description: 'Ready-made Vertical and Horizontal Cards with E-Commerce Grid.'
    path: screenshots/cards_grid_shimmer.png
  - description: 'Social Media Feed shimmer skeleton.'
    path: screenshots/feed_shimmer.png
  - description: 'Complete User Profile screen skeleton in Light Mode.'
    path: screenshots/profile_light_shimmer.png
  - description: 'Auto-adaptive Dark Mode shimmer skeleton.'
    path: screenshots/dark_mode_shimmer.png
